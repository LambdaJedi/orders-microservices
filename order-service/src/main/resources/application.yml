server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55434/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      # Dev convenience only. A real deployment would use Flyway/Liquibase migrations (see backlog).
      ddl-auto: update

catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  connect-timeout-ms: 2000
  read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
