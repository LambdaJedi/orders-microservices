server:
  port: 8081

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55433/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
  jpa:
    open-in-view: false
    hibernate:
      # Dev convenience only. A real deployment would use Flyway/Liquibase migrations (see backlog).
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info
